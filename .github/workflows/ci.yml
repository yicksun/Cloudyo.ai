name: Application verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://cloudyo:local-development-only@127.0.0.1:55432/cloudyo_dev
      TEST_DATABASE_URL: postgresql://cloudyo:local-development-only@127.0.0.1:55432/cloudyo_test
      E2E_DATABASE_URL: postgresql://cloudyo:local-development-only@127.0.0.1:55432/cloudyo_e2e_test
      EMAIL_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx playwright install chromium
      - name: Start disposable database
        shell: pwsh
        run: |
          $binaries = node --input-type=module -e 'import { initdb, pg_ctl } from "@embedded-postgres/windows-x64"; console.log(JSON.stringify({ initdb, pg_ctl }));' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot locate bundled PostgreSQL tools.' }
          $data = Join-Path $env:RUNNER_TEMP 'cloudyo-postgres'
          $passwordFile = Join-Path $env:RUNNER_TEMP 'cloudyo-postgres-password'
          try {
            [System.IO.File]::WriteAllText($passwordFile, "local-development-only`n")
            & $binaries.initdb -D $data -U cloudyo --auth=scram-sha-256 "--pwfile=$passwordFile" --encoding=UTF8 --locale=C
            if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL initialization failed.' }
          } finally {
            if (Test-Path -LiteralPath $passwordFile) {
              Remove-Item -LiteralPath $passwordFile -Force
            }
          }
          & $binaries.pg_ctl -D $data -l postgres.log -o '-p 55432 -h 127.0.0.1' -w start
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path postgres.log) { Get-Content postgres.log }
            throw 'PostgreSQL did not become ready.'
          }
          @'
          import EmbeddedPostgres from "embedded-postgres";
          const postgres = new EmbeddedPostgres({ user: "cloudyo", password: "local-development-only", port: 55432 });
          const client = postgres.getPgClient("postgres", "127.0.0.1");
          await client.connect();
          try {
            for (const database of ["cloudyo_dev", "cloudyo_test", "cloudyo_e2e_test"])
              await client.query(`CREATE DATABASE "${database}" ENCODING 'UTF8' TEMPLATE template0 LC_COLLATE 'C' LC_CTYPE 'C'`);
          } finally {
            await client.end();
          }
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw 'Disposable database creation failed.' }
      - name: Migrate test database
        shell: pwsh
        run: |
          $env:DATABASE_URL=$env:TEST_DATABASE_URL
          npm run db:migrate
      - run: npm run db:migrate && npm run db:seed && npm run build
      - name: Prepare isolated browser database
        shell: pwsh
        run: |
          $env:DATABASE_URL=$env:E2E_DATABASE_URL
          npm run db:migrate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run db:seed
      - run: npm run format:check && npm run lint && npm run typecheck
      - run: npm test && npm run test:integration
      - run: npm run test:deployment
      - run: npm run test:e2e
      - name: Stop disposable database
        if: always()
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'cloudyo-postgres'
          if (Test-Path (Join-Path $data 'postmaster.pid')) {
            $pgCtl = node --input-type=module -e 'import { pg_ctl } from "@embedded-postgres/windows-x64"; console.log(pg_ctl);'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot locate PostgreSQL shutdown tool.' }
            & $pgCtl -D $data -m fast -w stop
            if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL shutdown failed.' }
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-failure-evidence
          path: |
            playwright-report
            test-results
            postgres.log
