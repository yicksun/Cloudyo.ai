name: Production infrastructure verification
on:
  push:
    paths:
      - "infra/**"
      - "scripts/azure-release.mjs"
      - "scripts/provision.ps1"
      - "tests/infrastructure/**"
      - ".github/workflows/infrastructure.yml"
  pull_request:
    paths:
      - "infra/**"
      - "scripts/azure-release.mjs"
      - "scripts/provision.ps1"
      - "tests/infrastructure/**"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile production infrastructure
        run: |
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/main.json"
          az bicep build --file infra/release.bicep --outfile "$RUNNER_TEMP/release.json"
      - name: Scan infrastructure locally without uploading source
        env:
          LOG_LEVEL: ERROR
        run: |
          python3 -m venv "$RUNNER_TEMP/checkov"
          "$RUNNER_TEMP/checkov/bin/pip" install --quiet checkov==3.3.29
          "$RUNNER_TEMP/checkov/bin/checkov" -d infra --framework bicep --skip-download --quiet --compact
      - name: Verify release gates and image prerequisites
        env:
          RELEASE_IMAGE: node@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8
        run: |
          node --test tests/infrastructure/release.test.mjs
          docker pull "$RELEASE_IMAGE"
          docker image inspect "$RELEASE_IMAGE" --format '{{index .RepoDigests 0}}'
          docker run --rm --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work "$RELEASE_IMAGE" \
            sh -c 'command -v python3 && command -v tar && node --test tests/infrastructure/release.test.mjs'
      - name: Verify PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/provision.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
